name = "todomate-calendar"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "todomate.yestar.dev", custom_domain = true }
]

# Feed records (encrypted todomate-api session tokens + settings).
[[kv_namespaces]]
binding = "FEEDS"
id = "a1c612d2a5f3469c900bc82d8e0fa74e"

# todomate-api Worker (see ./api). Called directly, without a public network hop.
[[services]]
binding = "TODOMATE_API"
service = "todomate-api"

# Login attempts per client IP (on top of todomate-api's own limit).
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
# Used only when the TODOMATE_API service binding is missing (e.g. self-hosting elsewhere).
TODOMATE_API_BASE_URL = "https://todomate-api.yestar.dev"
TIMEZONE = "Asia/Seoul"
# Days ahead included in every feed. Past range is chosen per user on the site.
FUTURE_DAYS = "60"
# How long a generated calendar is cached at the edge (seconds).
CACHE_SECONDS = "180"

# Secret (set with `wrangler secret put`):
#   TOKEN_ENCRYPTION_KEY   openssl rand -hex 32

[observability]
enabled = true
